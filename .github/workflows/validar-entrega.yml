name: Validar Entrega do Grupo

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  validar:
    name: Escopo, estrutura e nomenclatura
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar grupo no titulo do PR
        id: grupo
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          NUM=$(printf '%s' "$TITULO" \
            | grep -oEi '(^|[^a-z0-9])(g|grupo[- ]?)[0-9]{1,2}([^0-9]|$)' \
            | grep -oE '[0-9]{1,2}' \
            | head -1)

          if [ -z "$NUM" ]; then
            echo "::error::Nao foi possivel detectar o grupo no titulo do PR."
            echo "Use o formato: [G02] Entrega M1 - Despacho e Frota"
            exit 1
          fi

          GRUPO=$(printf 'grupo-%02d' "$((10#$NUM))")
          echo "grupo=$GRUPO" >> "$GITHUB_OUTPUT"
          echo "Grupo detectado: $GRUPO"

      - name: Validar escopo, estrutura e nomenclatura
        env:
          GRUPO: ${{ steps.grupo.outputs.grupo }}
          BASE: origin/${{ github.base_ref }}
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          MARCO=$(printf '%s' "$TITULO" | grep -oEi 'm[[:space:]-]?[1-3]' | head -1 | tr -dc '1-3')
          if [ -n "$MARCO" ]; then
            ARG_MARCO="--marco M$MARCO"
            echo "Marco detectado: M$MARCO"
          else
            ARG_MARCO=""
            echo "::warning::Marco nao detectado no titulo. Use o formato: [G02] Entrega M1 - Nome do modulo"
          fi
          python3 scripts/check_entrega.py --grupo "$GRUPO" --base "$BASE" $ARG_MARCO \
            | tee validacao.txt

      - name: Conferir padrao de commits
        if: always()
        run: |
          BASE="origin/${{ github.base_ref }}"
          PADRAO='^\[G[0-9]{2}\] (feat|fix|docs|test|refactor|chore): .+'
          FORA=0
          while IFS= read -r MSG; do
            case "$MSG" in
              Merge*|Revert*|"") continue ;;
            esac
            if ! printf '%s' "$MSG" | grep -qE "$PADRAO"; then
              echo "::warning::Commit fora do padrao: $MSG"
              FORA=$((FORA + 1))
            fi
          done < <(git log --format=%s "$BASE"..HEAD)

          if [ "$FORA" -gt 0 ]; then
            echo "### Aviso" >> "$GITHUB_STEP_SUMMARY"
            echo "$FORA commit(s) fora do padrao \`[G0X] tipo: descricao\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Commits no padrao." 
          fi

      - name: Publicar resumo
        if: always()
        run: |
          {
            echo "## Validacao da entrega"
            echo ""
            echo '```text'
            cat validacao.txt 2>/dev/null || echo "validacao nao executada"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
